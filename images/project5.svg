<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 400" width="100%" height="100%">
  <defs>
    <linearGradient id="p5Grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#d97706" />
      <stop offset="100%" stop-color="#b91c1c" />
    </linearGradient>
    <filter id="p5Glow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#000" flood-opacity="0.3"/>
    </filter>
  </defs>
  <rect width="600" height="400" fill="url(#p5Grad)" rx="16" />
  
  <g filter="url(#p5Glow)">
    <!-- Lightbulb glowing behind or speech bubble -->
    <!-- Speech bubble shape for quiz -->
    <rect x="150" y="70" width="300" height="230" rx="24" fill="#ffffff" fill-opacity="0.95" />
    <polygon points="260,300 300,340 315,300" fill="#ffffff" fill-opacity="0.95" />
    
    <!-- Big Question Mark & Lightbulb symbol -->
    <circle cx="300" cy="150" r="45" fill="#fef3c7" stroke="#f59e0b" stroke-width="4" />
    <text x="300" y="168" font-family="system-ui, -apple-system, sans-serif" font-size="52" font-weight="900" fill="#d97706" text-anchor="middle">?</text>
    
    <!-- Option A & Option B indicators -->
    <rect x="180" y="215" width="110" height="28" rx="8" fill="#10b981" />
    <text x="235" y="234" font-family="system-ui, sans-serif" font-size="13" font-weight="bold" fill="#ffffff" text-anchor="middle">A: CORRECT</text>
    
    <rect x="310" y="215" width="110" height="28" rx="8" fill="#f1f5f9" stroke="#cbd5e1" stroke-width="1.5" />
    <text x="365" y="234" font-family="system-ui, sans-serif" font-size="13" font-weight="bold" fill="#64748b" text-anchor="middle">B: OPTION</text>
    
    <rect x="230" y="260" width="140" height="18" rx="6" fill="#e0e7ff" />
    <text x="300" y="273" font-family="system-ui, sans-serif" font-size="11" font-weight="600" fill="#4338ca" text-anchor="middle">Score: 100%</text>
  </g>
</svg>
