<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 400" width="100%" height="100%">
  <defs>
    <linearGradient id="p4Grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#7c3aed" />
      <stop offset="100%" stop-color="#db2777" />
    </linearGradient>
    <linearGradient id="rocketBody" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" />
      <stop offset="100%" stop-color="#f1f5f9" />
    </linearGradient>
    <filter id="p4Glow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#000" flood-opacity="0.3"/>
    </filter>
  </defs>
  <rect width="600" height="400" fill="url(#p4Grad)" rx="16" />
  
  <!-- Stars / Sparkles -->
  <circle cx="120" cy="90" r="3" fill="#ffffff" opacity="0.8" />
  <circle cx="180" cy="60" r="2" fill="#ffffff" opacity="0.6" />
  <circle cx="480" cy="110" r="4" fill="#ffffff" opacity="0.8" />
  <circle cx="510" cy="280" r="3" fill="#ffffff" opacity="0.7" />
  <circle cx="140" cy="300" r="2.5" fill="#ffffff" opacity="0.6" />
  
  <!-- Rocket Graphic centered and rotated 45 deg -->
  <g transform="translate(300, 200) rotate(-45)" filter="url(#p4Glow)">
    <!-- Exhaust flame -->
    <path d="M-20 60 Q0 110 0 130 Q0 110 20 60 Z" fill="#fbbf24" opacity="0.9" />
    <path d="M-12 60 Q0 95 0 110 Q0 95 12 60 Z" fill="#ef4444" />
    
    <!-- Left Fin -->
    <path d="M-28 30 L-55 70 L-25 65 Z" fill="#f43f5e" />
    <!-- Right Fin -->
    <path d="M28 30 L55 70 L25 65 Z" fill="#f43f5e" />
    
    <!-- Rocket Main Body -->
    <path d="M-30 40 C-30 -20 0 -85 0 -85 C0 -85 30 -20 30 40 L26 65 L-26 65 Z" fill="url(#rocketBody)" />
    <!-- Rocket Nosecone accent -->
    <path d="M-16 -50 C-10 -72 0 -85 0 -85 C0 -85 10 -72 16 -50 Z" fill="#f43f5e" />
    <!-- Porothole window -->
    <circle cx="0" cy="-10" r="14" fill="#38bdf8" stroke="#cbd5e1" stroke-width="4" />
    <circle cx="-4" cy="-14" r="3" fill="#ffffff" opacity="0.8" />
  </g>
</svg>
