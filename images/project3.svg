<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 400" width="100%" height="100%">
  <defs>
    <linearGradient id="p3Grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#059669" />
      <stop offset="100%" stop-color="#042f2e" />
    </linearGradient>
    <filter id="p3Glow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="8" stdDeviation="10" flood-color="#000" flood-opacity="0.3"/>
    </filter>
  </defs>
  <rect width="600" height="400" fill="url(#p3Grad)" rx="16" />
  
  <!-- Clipboard / Task list card -->
  <g filter="url(#p3Glow)">
    <rect x="175" y="65" width="250" height="275" rx="16" fill="#ffffff" fill-opacity="0.95" />
    <!-- Clipboard Top clip -->
    <rect x="250" y="50" width="100" height="30" rx="8" fill="#10b981" />
    <circle cx="300" cy="62" r="5" fill="#ffffff" />
    
    <!-- Checklist items -->
    <!-- Item 1 (Checked) -->
    <rect x="210" y="115" width="26" height="26" rx="6" fill="#10b981" />
    <polyline points="216,128 222,134 231,122" fill="none" stroke="#ffffff" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" />
    <rect x="250" y="123" width="145" height="10" rx="4" fill="#94a3b8" />
    
    <!-- Item 2 (Checked) -->
    <rect x="210" y="165" width="26" height="26" rx="6" fill="#10b981" />
    <polyline points="216,178 222,184 231,172" fill="none" stroke="#ffffff" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" />
    <rect x="250" y="173" width="130" height="10" rx="4" fill="#94a3b8" />
    
    <!-- Item 3 (Checked) -->
    <rect x="210" y="215" width="26" height="26" rx="6" fill="#10b981" />
    <polyline points="216,228 222,234 231,222" fill="none" stroke="#ffffff" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" />
    <rect x="250" y="223" width="110" height="10" rx="4" fill="#94a3b8" />
    
    <!-- Item 4 (Pending) -->
    <rect x="210" y="265" width="26" height="26" rx="6" fill="none" stroke="#cbd5e1" stroke-width="2" />
    <rect x="250" y="273" width="135" height="10" rx="4" fill="#64748b" />
  </g>
</svg>
