<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 400" width="100%" height="100%">
  <defs>
    <linearGradient id="p6Grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ea580c" />
      <stop offset="100%" stop-color="#991b1b" />
    </linearGradient>
    <filter id="p6Glow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#000" flood-opacity="0.3"/>
    </filter>
  </defs>
  <rect width="600" height="400" fill="url(#p6Grad)" rx="16" />
  
  <g filter="url(#p6Glow)">
    <!-- Plate / Cloche / Bowl -->
    <!-- Cloche dome -->
    <path d="M190 230 A 110 110 0 0 1 410 230 Z" fill="#ffffff" fill-opacity="0.95" />
    <!-- Cloche handle knob -->
    <circle cx="300" cy="110" r="16" fill="#fde047" stroke="#ea580c" stroke-width="3" />
    <!-- Tray base -->
    <rect x="160" y="235" width="280" height="18" rx="9" fill="#f8fafc" />
    <rect x="180" y="258" width="240" height="8" rx="4" fill="#fed7aa" />
    
    <!-- Steam curls -->
    <path d="M260 95 Q250 75 260 55" fill="none" stroke="#ffffff" stroke-width="3" stroke-linecap="round" opacity="0.75" />
    <path d="M300 85 Q310 65 300 45" fill="none" stroke="#ffffff" stroke-width="3.5" stroke-linecap="round" opacity="0.9" />
    <path d="M340 95 Q350 75 340 55" fill="none" stroke="#ffffff" stroke-width="3" stroke-linecap="round" opacity="0.75" />
    
    <!-- Fork & Spoon Accent -->
    <!-- Left Fork -->
    <g transform="translate(115, 140) rotate(-15)">
      <rect x="18" y="10" width="4" height="70" rx="2" fill="#fed7aa" />
      <path d="M12 10 L12 30 Q12 40 20 40 Q28 40 28 30 L28 10" fill="none" stroke="#fed7aa" stroke-width="3" />
      <line x1="20" y1="10" x2="20" y2="30" stroke="#fed7aa" stroke-width="2.5" />
    </g>
    <!-- Right Spoon -->
    <g transform="translate(450, 140) rotate(15)">
      <rect x="18" y="30" width="4" height="60" rx="2" fill="#fed7aa" />
      <ellipse cx="20" cy="20" rx="12" ry="18" fill="#fed7aa" />
    </g>
  </g>
</svg>
