<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 400" width="100%" height="100%">
  <defs>
    <linearGradient id="p2Grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0284c7" />
      <stop offset="100%" stop-color="#0f172a" />
    </linearGradient>
    <linearGradient id="sunGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fde047" />
      <stop offset="100%" stop-color="#ea580c" />
    </linearGradient>
    <filter id="p2Glow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#000" flood-opacity="0.3"/>
    </filter>
  </defs>
  <rect width="600" height="400" fill="url(#p2Grad)" rx="16" />
  
  <g filter="url(#p2Glow)">
    <!-- Sun -->
    <circle cx="370" cy="160" r="58" fill="url(#sunGrad)" />
    <!-- Sun Rays -->
    <g stroke="#fde047" stroke-width="4" stroke-linecap="round" opacity="0.8">
      <line x1="370" y1="82" x2="370" y2="95" />
      <line x1="370" y1="225" x2="370" y2="238" />
      <line x1="292" y1="160" x2="305" y2="160" />
      <line x1="435" y1="160" x2="448" y2="160" />
      <line x1="315" y1="105" x2="325" y2="115" />
      <line x1="415" y1="205" x2="425" y2="215" />
      <line x1="315" y1="215" x2="325" y2="205" />
      <line x1="415" y1="115" x2="425" y2="105" />
    </g>
    
    <!-- Cloud -->
    <path d="M210 270 L380 270 A 45 45 0 0 0 380 180 A 60 60 0 0 0 265 170 A 45 45 0 0 0 210 270 Z" fill="#ffffff" fill-opacity="0.9" />
    <!-- Raindrops -->
    <g stroke="#38bdf8" stroke-width="3" stroke-linecap="round" opacity="0.85">
      <line x1="240" y1="290" x2="230" y2="315" />
      <line x1="280" y1="290" x2="270" y2="315" />
      <line x1="320" y1="290" x2="310" y2="315" />
      <line x1="360" y1="290" x2="350" y2="315" />
    </g>
  </g>
</svg>
